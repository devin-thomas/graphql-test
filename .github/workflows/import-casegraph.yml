name: Import CaseGraph source
on:
  push:
    paths:
      - '.casegraph-source.txz.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract verified source archive
        shell: bash
        run: |
          base64 -d .casegraph-source.txz.b64 > /tmp/casegraph-source.tar.xz
          tar -xJf /tmp/casegraph-source.tar.xz
          rm -f .casegraph-source.txz.b64 .github/workflows/import-casegraph.yml
      - name: Commit unpacked source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import CaseGraph GraphQL application"
          git push
